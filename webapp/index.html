<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table & Field Configuration</title>
    <script>
        window.addEventListener('error', function(e) {
            console.log("[DEBUG ERROR STACK]:", e.error ? e.error.stack : e.message);
        });
        window.addEventListener('unhandledrejection', function(e) {
            console.log("[DEBUG REJECTION STACK]:", e.reason ? (e.reason.stack || e.reason) : e);
        });
    </script>

    <script id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{ "ztbl.config.ui": "./" }'
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted">
    </script>
    <script>
        // Self-healing prototype patcher for storeInnerAppStateAsync in standalone mode
        (function() {
            // Monkey-patch SAPUI5 Logger to intercept and print stack traces
            var patchLogger = function() {
                try {
                    if (window.sap && sap.ui && sap.ui.loader && sap.ui.loader._ && sap.ui.loader._.modules) {
                        var modules = sap.ui.loader._.modules;
                        for (var name in modules) {
                            if (name.indexOf("sap/base/Log") !== -1) {
                                var mod = modules[name];
                                var Log = mod.exports || mod.content;
                                if (Log && !Log._patched) {
                                    var originalError = Log.error;
                                    Log.error = function(message, details, component) {
                                        console.log("[LOGGER INTERCEPTED ERROR]:", message, "Details:", details, "Component:", component);
                                        var err = new Error();
                                        console.log("[LOGGER ERROR CALL STACK]:", err.stack);
                                        return originalError.apply(this, arguments);
                                    };
                                    Log._patched = true;
                                    console.log("[Polyfill] Successfully monkey-patched sap.base.Log.error via loader module:", name);
                                }
                            }
                        }
                    }
                } catch(e) {}
            };

            // Patch sap.fe.core.AppComponent getNavigationService
            var patchAppComponent = function() {
                try {
                    if (window.sap && sap.ui && sap.ui.loader && sap.ui.loader._ && sap.ui.loader._.modules) {
                        var modules = sap.ui.loader._.modules;
                        for (var name in modules) {
                            if (name.indexOf("sap/fe/core/AppComponent") !== -1) {
                                var mod = modules[name];
                                var AppComponent = mod.exports || mod.content;
                                if (AppComponent && AppComponent.prototype && !AppComponent._patched) {
                                    AppComponent.prototype.getNavigationService = function() {
                                        return {
                                            storeInnerAppStateAsync: function() {
                                                return Promise.resolve("mock-key");
                                            },
                                            replaceInnerAppStateKey: function(s, e) {
                                                return s;
                                            },
                                            storeInnerAppState: function() {
                                                return "mock-key";
                                            },
                                            getAppState: function() {
                                                return Promise.resolve({});
                                            },
                                            getStartupParameters: function() {
                                                return {};
                                            }
                                        };
                                    };
                                    AppComponent._patched = true;
                                    console.log("[Polyfill] Successfully patched AppComponent.prototype.getNavigationService");
                                }
                            }
                        }
                    }
                } catch(e) {}
            };

            // Also register early require callback
            try {
                if (window.sap && sap.ui && sap.ui.require) {
                    sap.ui.require(["sap/base/Log"], function(Log) {
                        if (Log && !Log._patched) {
                            var originalError = Log.error;
                            Log.error = function(message, details, component) {
                                console.log("[LOGGER INTERCEPTED ERROR]:", message, "Details:", details, "Component:", component);
                                var err = new Error();
                                console.log("[LOGGER ERROR CALL STACK]:", err.stack);
                                return originalError.apply(this, arguments);
                            };
                            Log._patched = true;
                            console.log("[Polyfill] Successfully monkey-patched sap.base.Log.error via early sap.ui.require");
                        }
                    });
                }
            } catch(e) {}

            var traversed = new Set();
            var patchPrototypes = function() {
                // Patch Logger
                patchLogger();

                // Patch AppComponent
                patchAppComponent();

                // Approach 1: Traverse window.sap global namespace
                var traverse = function(obj, path) {
                    if (!obj || typeof obj !== "object" || traversed.has(obj) || path.split(".").length > 8) return;
                    traversed.add(obj);
                    try {
                        if (obj.prototype && typeof obj.prototype === "object") {
                            var proto = obj.prototype;
                            // Patch storeInnerAppStateAsync if storeInnerAppState is present
                            if (proto.storeInnerAppState && !proto.storeInnerAppStateAsync) {
                                proto.storeInnerAppStateAsync = function() {
                                    return Promise.resolve({ appStateKey: "mock-key" });
                                };
                                console.log("[Polyfill] Dynamically patched prototype of:", path);
                            }
                            // Also patch storeAppStateAsync if storeAppState is present
                            if (proto.storeAppState && !proto.storeAppStateAsync) {
                                proto.storeAppStateAsync = function() {
                                    return Promise.resolve({ appStateKey: "mock-key" });
                                };
                                console.log("[Polyfill] Dynamically patched storeAppState for:", path);
                            }
                        }
                        for (var key in obj) {
                            if (key !== "prototype" && obj[key] && (typeof obj[key] === "object" || typeof obj[key] === "function")) {
                                traverse(obj[key], path + "." + key);
                            }
                        }
                    } catch(e) {}
                };
                if (window.sap) {
                    traverse(window.sap, "sap");
                }

                // Approach 2: Traverse private UI5 module registry cache
                try {
                    if (window.sap && sap.ui && sap.ui.loader && sap.ui.loader._ && sap.ui.loader._.modules) {
                        var modules = sap.ui.loader._.modules;
                        for (var name in modules) {
                            var mod = modules[name];
                            // State 4 = READY, State 3 = DEFINED / loaded
                            if (mod && mod.exports) {
                                var exports = mod.exports;
                                if (exports.prototype && typeof exports.prototype === "object") {
                                    var proto = exports.prototype;
                                    if (proto.storeInnerAppState && !proto.storeInnerAppStateAsync) {
                                        proto.storeInnerAppStateAsync = function() {
                                            return Promise.resolve({ appStateKey: "mock-key" });
                                        };
                                        console.log("[Polyfill] Loader cache patched:", name);
                                    }
                                    if (proto.storeAppState && !proto.storeAppStateAsync) {
                                        proto.storeAppStateAsync = function() {
                                            return Promise.resolve({ appStateKey: "mock-key" });
                                        };
                                        console.log("[Polyfill] Loader cache patched storeAppState for:", name);
                                    }
                                }
                            }
                        }
                    }
                } catch(e) {}
            };

            // Run scanner periodically during application bootstrap
            var count = 0;
            var interval = setInterval(function() {
                patchPrototypes();
                count++;
                if (count > 150) { // Stop scanning after 7.5 seconds
                    clearInterval(interval);
                }
            }, 50);
        })();

        sap.ui.getCore().attachInit(function () {
            // Bootstrap ComponentSupport
            sap.ui.require(["sap/ui/core/ComponentSupport"]);
        });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div data-sap-ui-component
         data-name="ztbl.config.ui"
         data-id="container"
         data-settings='{ "id": "ztbl.config.ui" }'
         style="height: 100%;">
    </div>
</body>
</html>
