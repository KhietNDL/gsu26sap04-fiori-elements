specVersion: '3.1'
metadata:
  name: ztbl-authorization-ui
type: application
resources:
  configuration:
    paths:
      webapp: dist
builder:
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        verbose: true
        ignoreCertErrors: true
        target:
          url: https://s40lp1.ucc.cit.tum.de
          client: '324'
          auth: basic
          credentials:
            username: env:SAP_USER
            password: env:SAP_PASSWORD
        app:
          name: ZZTBL_AUTH_UI
          description: Authorization Management
          package: $tmp
          transport: ''
        exclude:
          - /test/
          - /localService/
          - /annotations/README.md
